<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>法务群自动化管理后台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230f8c82'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='white'%3E%E6%B3%95%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/admin/styles.css?v=20260730-09" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">法</div>
          <div>
            <div class="brand-title">法务自动化</div>
            <div class="brand-subtitle">WeCom Ops Console</div>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-section="workbench" data-view="overview">工作台</button>
          <button class="nav-item" data-section="payments" data-view="payment-trackings">缴费跟踪</button>
          <button class="nav-item" data-section="documents" data-view="ocr-reviews">法律文书</button>
          <button class="nav-item" data-section="repayment" data-view="repayment-ledger">还款管理</button>
          <button class="nav-item" data-section="communication" data-view="merchant-questions">沟通提醒</button>
          <button class="nav-item" data-section="kdocs" data-view="kdocs-browser">金山台账</button>
          <button class="nav-item" data-section="system" data-view="archive-groups">系统管理</button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="view-title">工作台</h1>
            <p id="view-subtitle">集中处理待办、失败任务和业务异常</p>
          </div>
          <div class="key-panel">
            <input id="api-key-input" type="password" placeholder="X-API-Key" autocomplete="off" />
            <button id="save-key-btn">保存</button>
            <button id="refresh-btn" class="ghost">刷新</button>
          </div>
        </header>

        <nav id="section-tabs" class="section-tabs" aria-label="当前业务模块"></nav>

        <section id="alert" class="alert hidden"></section>
        <section id="content"></section>
      </main>
    </div>

    <template id="empty-state-template">
      <div class="empty-state">暂无数据</div>
    </template>

    <script src="/admin/admin.js?v=20260730-09"></script>
  </body>
</html>
